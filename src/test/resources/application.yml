spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

github:
  api:
    base-url: https://api.github.com
    token:
    default-per-page: 30
    connect-timeout: 5s
    read-timeout: 10s
