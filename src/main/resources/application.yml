spring:
  application:
    name: github-repository-searcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/github_searcher}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # for production use a migration tool; see docs/schema.sql
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}      # optional, raises the rate limit from 10 to 30 search requests/min
    default-per-page: 30
    connect-timeout: 5s
    read-timeout: 10s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8082
